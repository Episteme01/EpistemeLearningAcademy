<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Episteme Learning Academy</title>
    <script>
      // GitHub Pages SPA fallback (based on rafgraph/spa-github-pages).
      // A project site lives at /<repo>/ so keep exactly 1 path segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      // collapse accidental double slashes (e.g. a shared link built with a trailing slash)
      l = { protocol: l.protocol, hostname: l.hostname, port: l.port, pathname: l.pathname.replace(/\/{2,}/g, '/'), search: l.search, hash: l.hash, replace: function (u) { window.location.replace(u); } };
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
